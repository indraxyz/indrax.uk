<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--theme-init-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>Indra’s Admin</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      /* Mirrors components/page-loading.tsx, so React's loader replaces this one
         without a visible change: one spinner from first byte to first data. */
      .admin-boot-loading {
        position: fixed;
        inset: 0;
        z-index: 90;
        display: grid;
        place-items: center;
        background: var(--color-background, #fff);
        color: var(--component-navigation-progress, #90b800);
      }
      .admin-boot-loading svg {
        width: 3rem;
        height: 3rem;
        animation: admin-boot-spin 1s linear infinite;
      }
      @keyframes admin-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .admin-boot-loading svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="admin-boot-loading" role="status" aria-label="Loading page">
        <!--loading-indicator-->
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

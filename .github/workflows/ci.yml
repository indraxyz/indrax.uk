# The gate every pull request has to pass.
#
# This exists mostly for the Dependabot pull requests next door. A bot that
# raises a bump nobody can verify is worse than no bot: it either gets merged
# unread or it rots. So the same `npm run check` that runs before a commit here
# runs on the branch, and the bump either survives it or says why not.
#
# Two jobs rather than one, running in parallel. `check` is seconds and catches
# most of what breaks; `e2e` is minutes and catches the rest. Separating them
# means a type error reports in a minute instead of waiting behind a browser
# download.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# A second push supersedes the first; no point finishing a run for a commit that
# has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # `ci` rather than `install`: it fails on a lockfile that disagrees with
      # package.json instead of quietly rewriting it, which is the property that
      # makes the lockfile worth reviewing.
      - run: npm ci

      - run: npm run check

      # No DATABASE_URL here on purpose. Every read degrades to an empty result
      # rather than throwing, so the site builds without one - and asserting that
      # keeps the property true, since it is also what a fresh clone gets.
      - run: npm run build

      # Advisories appear between commits, not because of them, so this reports
      # rather than blocks - a high finding in a transitive dependency should not
      # stop an unrelated fix from merging. `npm audit` exits non-zero on any
      # finding, hence the guard.
      - name: Audit
        run: npm audit --audit-level=high || true

  # The suite that actually opens the site.
  #
  # Phase 5 is the argument for this job existing. Two real defects shipped past
  # a green local run and a code review, and both were caught only when the suite
  # ran against a database: search would have indexed every `href` in an article,
  # making an injected spam link a search term, and the series clash check matched
  # nothing so every duplicate part number would have reached the author as a 500.
  # Forty-seven of the specs skip themselves without a database, and those
  # forty-seven are where both bugs lived.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # The same stack `npm run db:up` starts locally, on the same ports, from the
      # same docker-compose.yml - so CI and a laptop cannot drift apart. The
      # application reaches Postgres through the Neon HTTP proxy on 4444, because
      # that is the only protocol Workers can speak; drizzle-kit speaks the wire
      # protocol and goes to 55432 directly.
      DATABASE_URL: postgres://indrax:indrax@127.0.0.1:4444/indrax?sslmode=require
      DIRECT_DATABASE_URL: postgres://indrax:indrax@127.0.0.1:55432/indrax

      # Throwaway, and safe to have in the open. Nothing here authenticates
      # against anything real: the OAuth values are never exercised, because the
      # admin specs mint a session directly against the database rather than
      # round-tripping GitHub. This secret signs cookies for a Postgres that is
      # created and destroyed inside one job, so it protects nothing that outlives
      # the run. A repository secret would be worse - a real credential in a place
      # it is not needed.
      BETTER_AUTH_SECRET: ci-only-secret-for-an-ephemeral-database-0000
      ALLOWED_GITHUB_ID: "1"
      GITHUB_CLIENT_ID: ci-only
      GITHUB_CLIENT_SECRET: ci-only

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `--wait` blocks until the healthchecks pass, so the migration below never
      # races a Postgres that is still starting.
      - name: Start Postgres and the Neon proxy
        run: npm run db:up

      - name: Migrate and seed
        run: |
          npm run db:migrate
          npm run db:seed

      # Browsers are ~150MB and change only with the Playwright version, which
      # moves with the lockfile.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright
        # The system libraries a browser links against live outside that cache, so
        # they are installed either way; only the download is skipped on a hit.
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # Builds and starts the site itself - see `webServer` in
      # playwright.config.ts. Nothing here sets PLAYWRIGHT_CHANNEL: the runner can
      # run Playwright's own pinned Chromium, which is the browser everyone should
      # be tested against. The override exists for developer machines on an OS it
      # no longer builds for.
      - name: Run the suite
        run: npx playwright test

      # Only on failure, and only for a fortnight. A passing run's report is
      # noise; a failing one holds the trace, the screenshot and the accessibility
      # snapshot that says which element was actually on top.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

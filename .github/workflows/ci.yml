# The gate every pull request has to pass.
#
# This exists mostly for the Dependabot pull requests next door. A bot that
# raises a bump nobody can verify is worse than no bot: it either gets merged
# unread or it rots. So the same `npm run check` that runs before a commit here
# runs on the branch, and the bump either survives it or says why not.
#
# Two jobs rather than one, running in parallel. `check` is seconds and catches
# most of what breaks; `e2e` is minutes and catches the rest. Separating them
# means a type error reports in a minute instead of waiting behind a browser
# download.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `ci` rather than `install`: it fails on a lockfile that disagrees with
      # package.json instead of quietly rewriting it, which is the property that
      # makes the lockfile worth reviewing.
      - run: npm ci

      - run: npm run check

      # No DATABASE_URL here on purpose. Every read degrades to an empty result
      # rather than throwing, so the site builds without one - and asserting that
      # keeps the property true, since it is also what a fresh clone gets.
      - name: Build and validate production target
        run: |
          npm run build:production
          node scripts/assert-deploy-target.mjs production

      - name: Build and validate staging Preview target
        run: |
          npm run build:staging
          node scripts/assert-deploy-target.mjs staging

      # Advisories appear between commits, not because of them, so this reports
      # rather than blocks - a high finding in a transitive dependency should not
      # stop an unrelated fix from merging. `npm audit` exits non-zero on any
      # finding, hence the guard.
      - name: Audit
        run: npm audit --audit-level=high || true

  # The suite that actually opens the site.
  #
  # Phase 5 is the argument for this job existing. Two real defects shipped past
  # a green local run and a code review, and both were caught only when the suite
  # ran against a database: search would have indexed every `href` in an article,
  # making an injected spam link a search term, and the series clash check matched
  # nothing so every duplicate part number would have reached the author as a 500.
  # Seeded-content and authenticated specs skip without their fixture environment,
  # so a database-free smoke run cannot establish the same coverage.
  e2e:
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # The same stack `npm run db:up` starts locally, on the same ports, from the
      # same docker-compose.yml - so CI and a laptop cannot drift apart. The
      # application reaches Postgres through the Neon HTTP proxy on 4444, because
      # that is the transport used by our Worker driver; drizzle-kit speaks the wire
      # protocol and goes to 55432 directly.
      DATABASE_URL: postgres://indrax:indrax@127.0.0.1:4444/indrax?sslmode=require
      DIRECT_DATABASE_URL: postgres://indrax:indrax@127.0.0.1:55432/indrax

      # Throwaway, and safe to have in the open. Nothing here authenticates
      # against anything real: the OAuth values are never exercised, because the
      # admin specs mint a session directly against the database rather than
      # round-tripping GitHub. This secret signs cookies for a Postgres that is
      # created and destroyed inside one job, so it protects nothing that outlives
      # the run. A repository secret would be worse - a real credential in a place
      # it is not needed.
      BETTER_AUTH_SECRET: ci-only-secret-for-an-ephemeral-database-0000
      ALLOWED_GITHUB_ID: "1"
      GITHUB_CLIENT_ID: ci-only
      GITHUB_CLIENT_SECRET: ci-only

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `--wait` blocks until the healthchecks pass, so the migration below never
      # races a Postgres that is still starting.
      - name: Start Postgres and the Neon proxy
        run: npm run db:up

      - name: Migrate and seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Check database request budgets and atomic writes
        run: TEST_DATABASE_URL="$DATABASE_URL" npm run test:integration

      # Browsers are ~150MB and change only with the Playwright version, which
      # moves with the lockfile.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-firefox-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright
        # The system libraries a browser links against live outside that cache, so
        # they are installed either way; only the download is skipped on a hit.
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium firefox
          else
            npx playwright install --with-deps chromium firefox
          fi

      # Builds and starts the site itself - see `webServer` in
      # playwright.config.ts. Nothing here sets PLAYWRIGHT_CHANNEL: the runner can
      # run Playwright's own pinned Chromium, which is the browser everyone should
      # be tested against. The override exists for developer machines on an OS it
      # no longer builds for.
      - name: Run the suite
        run: npx playwright test

      - name: Verify direct PostHog transport
        run: npm run test:e2e:analytics-direct

      - name: Verify development document hydration
        run: E2E_PORT=3352 npx playwright test --config playwright.hydration.config.ts

      - name: Verify Firefox hydration and restored filter state
        run: PLAYWRIGHT_BROWSER=firefox E2E_PORT=3353 npx playwright test --config playwright.hydration.config.ts

      - name: Verify isolated local cover uploads
        run: E2E_HOST=localhost E2E_PORT=3351 npm run test:e2e:uploads

      # Only on failure, and only for a fortnight. A passing run's report is
      # noise; a failing one holds the trace, the screenshot and the accessibility
      # snapshot that says which element was actually on top.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            test-results-uploads/
            test-results-analytics-direct/
          retention-days: 14

  deploy:
    # This job condition intentionally reads the repository/organization variable;
    # environment variables are unavailable until the job starts.
    if: github.event_name == 'push' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    needs: [check, e2e]
    # Do not interrupt an upload/activation already in progress. Quality jobs still
    # cancel superseded runs independently above.
    concurrency:
      group: cloudflare-indrax
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://indrax.uk' || steps.staging.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANALYTICS_ENABLED: ${{ vars.ANALYTICS_ENABLED }}
      ANALYTICS_TRANSPORT: ${{ vars.ANALYTICS_TRANSPORT }}
      POSTHOG_PUBLIC_KEY: ${{ vars.POSTHOG_PUBLIC_KEY }}
      POSTHOG_PUBLIC_HOST: ${{ vars.POSTHOG_PUBLIC_HOST }}
      MEDIA_ORIGIN: ${{ vars.MEDIA_ORIGIN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Refuse superseded deployment revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          test "$current_sha" = "$GITHUB_SHA" || { echo 'This revision has been superseded; deploy the current branch head.' >&2; exit 1; }

      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN in the GitHub environment' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID in the GitHub environment' >&2; exit 1; }

      - name: Prepare the matching analytics quota table
        if: env.ANALYTICS_TRANSPORT != 'direct'
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            node scripts/prepare-deployment-d1.mjs production
          else
            node scripts/prepare-deployment-d1.mjs staging
          fi

      - name: Check Preview maintenance configuration
        if: github.ref == 'refs/heads/develop'
        env:
          PREVIEW_MAINTENANCE_TOKEN: ${{ secrets.PREVIEW_MAINTENANCE_TOKEN }}
        run: node -e 'const t = process.env.PREVIEW_MAINTENANCE_TOKEN; if (!t || t.length < 32 || t.length > 512 || /\s/.test(t)) throw new Error("Configure PREVIEW_MAINTENANCE_TOKEN before Preview cutover")'

      - name: Deploy production
        if: github.ref == 'refs/heads/main'
        run: npm run deploy

      - name: Deploy named staging Preview
        id: staging
        if: github.ref == 'refs/heads/develop'
        run: npm run deploy:staging

      - name: Verify public and private security boundaries
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            npm run security:smoke -- production
          else
            npm run security:smoke -- staging https://develop.previews.indrax.uk
          fi

      - name: Verify deployed analytics configuration and SDK assets
        if: env.ANALYTICS_ENABLED == 'true' && env.ANALYTICS_TRANSPORT != 'direct'
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            node scripts/verify-analytics.mjs production
          else
            node scripts/verify-analytics.mjs staging https://develop.previews.indrax.uk
          fi

      - name: Invoke staging media cleanup
        if: github.ref == 'refs/heads/develop'
        env:
          PREVIEW_MAINTENANCE_TOKEN: ${{ secrets.PREVIEW_MAINTENANCE_TOKEN }}
        run: node scripts/preview-maintenance.mjs

      - name: Retain public staging deployment record
        if: always() && steps.staging.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: staging-deployment-${{ github.sha }}
          path: build/staging-deployment.json
          if-no-files-found: error
          retention-days: 30
